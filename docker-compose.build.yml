# Build the image from this source folder instead of pulling it from GitHub.
#   docker compose -f docker-compose.build.yml up -d --build
services:
  inkvault:
    build: .
    container_name: inkvault
    restart: unless-stopped
    ports:
      - "4777:4777"
    volumes:
      - ./vault:/vault
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
