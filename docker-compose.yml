# InkVault for CasaOS (or any Docker host).
# CasaOS: App Store → "+" (top right) → Install a customized app → Import → paste this file.
name: inkvault

services:
  inkvault:
    image: ghcr.io/daviied/note-b:latest
    container_name: inkvault
    restart: unless-stopped
    ports:
      - target: 4777
        published: "4777"
        protocol: tcp
    volumes:
      # Your notes (Markdown) and drawings (SVG). Back this folder up.
      - type: bind
        source: /DATA/AppData/inkvault/vault
        target: /vault
    environment:
      # Optional. The address the tablet should use, e.g. http://192.168.1.20:4777
      # Not needed if you open the PC page via the server's IP (the QR code uses that address).
      PUBLIC_URL: ""
    x-casaos:
      envs:
        - container: PUBLIC_URL
          description:
            en_us: Optional address for the tablet, e.g. http://192.168.1.20:4777
      ports:
        - container: "4777"
          description:
            en_us: Web UI (PC at /pc, tablet at /tablet)
      volumes:
        - container: /vault
          description:
            en_us: Notes and drawings

x-casaos:
  architectures:
    - amd64
    - arm64
  main: inkvault
  author: daviied
  developer: daviied
  category: Productivity
  title:
    en_us: InkVault
  tagline:
    en_us: Type notes on the PC, draw on the tablet
  description:
    en_us: Obsidian-style Markdown notes. Drawing fields you add on the PC open automatically on your tablet, with pen pressure, tilt, palm rejection and scribble-to-erase.
  icon: https://raw.githubusercontent.com/daviied/note-b/main/docs/icon.png
  port_map: "4777"
  index: /pc
  scheme: http
