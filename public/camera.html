<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkVault Camera</title>
<meta name="theme-color" content="#0e0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InkVault Camera">
<link rel="manifest" href="/manifest-camera.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/styles/camera.css">
</head>
<body>
<!-- Waiting: nothing to do until the PC asks for a picture -->
<section id="idle">
  <div class="status"><span class="dot"></span><span class="txt-on">Connected · waiting for PC</span><span class="txt-off">Connecting…</span></div>
  <p class="hint">On the PC, press <b>Picture</b> (Ctrl+Alt+P) and this screen will ask for a photo.</p>
</section>

<!-- The PC wants a picture -->
<section id="ask" hidden>
  <p class="for">Picture for <b id="note"></b></p>
  <label class="big primary">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    Take photo
    <input type="file" id="take" accept="image/*" capture="environment">
  </label>
  <label class="big">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
    Choose from gallery
    <input type="file" id="pick" accept="image/*">
  </label>
  <button id="cancel" class="link">Cancel</button>
</section>

<!-- Step 1: drag the corners onto the board -->
<section id="edit" class="full" hidden>
  <p class="for">Drag the corners onto the board or page</p>
  <div class="stage"><canvas id="edit-canvas"></canvas></div>
  <div class="row">
    <button id="edit-whole" class="btn">Whole photo</button>
    <button id="edit-auto" class="btn">Auto-detect</button>
    <button id="edit-next" class="btn primary">Next</button>
  </div>
  <button id="edit-back" class="link">Choose another photo</button>
</section>

<!-- Step 2: straightened result -->
<section id="result" class="full" hidden>
  <div class="stage"><canvas id="result-canvas"></canvas></div>
  <div class="row">
    <button id="res-back" class="btn">Adjust corners</button>
    <button id="res-rotate" class="btn">Rotate</button>
    <label class="btn toggle"><input type="checkbox" id="res-enhance" checked> Clean up</label>
  </div>
  <button id="res-send" class="btn primary wide">Send to PC</button>
</section>

<!-- Uploading -->
<section id="sending" hidden>
  <img id="preview" alt="">
  <div class="bar"><i id="progress"></i></div>
  <p id="sending-text">Sending to PC…</p>
</section>

<div id="toast"></div>
<script type="module" src="/build/camera.js"></script>
</body>
</html>
