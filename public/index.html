<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkVault</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e11; color: #e8e8ee; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { text-align: center; max-width: 560px; width: 100%; }
  h1 { font-weight: 650; letter-spacing: -.01em; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 28px; }
  a { display: block; padding: 24px; border-radius: 14px; background: #1b1b20; border: 1px solid #2c2c34; color: inherit; text-decoration: none; }
  a:hover { border-color: #8b7bff; }
  a b { display: block; font-size: 18px; margin-bottom: 4px; }
  a span { color: #8a8a96; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>InkVault</h1>
  <p style="color:#8a8a96">Which device is this?</p>
  <div class="choices">
    <a href="/pc"><b>PC</b><span>Type notes, see every drawing.</span></a>
    <a href="/tablet"><b>Tablet</b><span>Pen canvas that opens when the PC asks.</span></a>
  </div>
</main>
</body>
</html>
